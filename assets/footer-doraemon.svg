<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 92" width="100%" role="img" aria-label="doraBighead Doraemon Theme Footer">
  <defs>
    <linearGradient id="footerSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006BB3"/>
      <stop offset="50%" stop-color="#00A0E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="footerBell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="footerClip">
      <rect x="0" y="0" width="960" height="92" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect x="0" y="0" width="960" height="92" fill="url(#footerSky)"/>

    <!-- Top Red Collar Accent -->
    <rect x="0" y="0" width="960" height="7" fill="#E60012"/>

    <!-- Subtle 4D Pocket Arc -->
    <path d="M 380 92 A 100 58 0 0 1 580 92" fill="#FFFFFF" opacity="0.12"/>

    <!-- Centered Golden Bell -->
    <g transform="translate(480, 10)">
      <circle cx="0" cy="0" r="9" fill="url(#footerBell)" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="0" cy="2.5" r="1.8" fill="#78350F"/>
    </g>

    <!-- Closing Motto -->
    <text x="480" y="58" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">
      ✨ Powered by 4D Pocket &amp; Curiosity  •  Keep Exploring CS ✨
    </text>
  </g>
</svg>
