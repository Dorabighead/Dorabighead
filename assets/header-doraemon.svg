<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" role="img" aria-label="doraBighead Doraemon Theme Header">
  <defs>
    <linearGradient id="doraSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#00A0E9"/>
      <stop offset="100%" stop-color="#006BB3"/>
    </linearGradient>
    <linearGradient id="bellGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="doorPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="960" height="220" rx="18" ry="18"/>
    </clipPath>
    <style>
      .float-slow { animation: floatSlow 4.5s ease-in-out infinite; }
      .float-fast { animation: floatFast 3.6s ease-in-out infinite; }
      .twinkle { animation: twinkle 3s ease-in-out infinite; }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Sky background -->
    <rect x="0" y="0" width="960" height="220" fill="url(#doraSky)"/>

    <!-- Soft ambient light circles -->
    <circle cx="145" cy="40" r="120" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="835" cy="185" r="140" fill="#FFFFFF" opacity="0.08"/>

    <!-- Twinkling stars -->
    <g fill="#FFFFFF" class="twinkle">
      <circle cx="240" cy="42" r="2.2"/>
      <circle cx="710" cy="36" r="2.6"/>
      <circle cx="760" cy="78" r="1.8"/>
      <circle cx="290" cy="164" r="1.8"/>
      <circle cx="670" cy="158" r="2.2"/>
    </g>

    <!-- Soft clouds -->
    <g fill="#FFFFFF" opacity="0.16">
      <ellipse cx="110" cy="198" rx="75" ry="28"/>
      <ellipse cx="185" cy="206" rx="60" ry="22"/>
      <ellipse cx="830" cy="196" rx="85" ry="30"/>
      <ellipse cx="745" cy="208" rx="58" ry="20"/>
    </g>

    <!-- Left: Minimalist Cute Doraemon -->
    <g class="float-slow" transform="translate(115, 112)">
      <!-- Bamboo copter -->
      <line x1="0" y1="-58" x2="0" y2="-45" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="-59" rx="22" ry="3.5" fill="#FDE047"/>
      <circle cx="0" cy="-45" r="4" fill="#F59E0B"/>
      <!-- Blue head -->
      <circle cx="0" cy="0" r="46" fill="#00A0E9" stroke="#FFFFFF" stroke-width="2.5"/>
      <!-- White face -->
      <ellipse cx="0" cy="8" rx="38" ry="34" fill="#FFFFFF"/>
      <!-- Eyes -->
      <ellipse cx="-10" cy="-14" rx="8.5" ry="10.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8"/>
      <ellipse cx="10" cy="-14" rx="8.5" ry="10.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8"/>
      <circle cx="-7" cy="-12" r="3.2" fill="#1E293B"/>
      <circle cx="7" cy="-12" r="3.2" fill="#1E293B"/>
      <circle cx="-6" cy="-13.5" r="1.1" fill="#FFFFFF"/>
      <circle cx="8" cy="-13.5" r="1.1" fill="#FFFFFF"/>
      <!-- Red nose -->
      <circle cx="0" cy="-3" r="5.5" fill="#E60012"/>
      <circle cx="-1.8" cy="-4.8" r="1.6" fill="#FFFFFF" opacity="0.8"/>
      <!-- Smile & philtrum -->
      <line x1="0" y1="2.5" x2="0" y2="18" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M -20 12 Q 0 28 20 12" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <!-- Whiskers -->
      <g stroke="#334155" stroke-width="1.5" stroke-linecap="round">
        <line x1="-29" y1="1" x2="-15" y2="4"/>
        <line x1="-31" y1="9" x2="-15" y2="9"/>
        <line x1="-29" y1="17" x2="-15" y2="14"/>
        <line x1="29" y1="1" x2="15" y2="4"/>
        <line x1="31" y1="9" x2="15" y2="9"/>
        <line x1="29" y1="17" x2="15" y2="14"/>
      </g>
      <!-- Red collar -->
      <rect x="-32" y="37" width="64" height="8" rx="4" fill="#E60012"/>
      <!-- Golden bell -->
      <circle cx="0" cy="46" r="8.5" fill="url(#bellGold)" stroke="#B45309" stroke-width="1.4"/>
      <line x1="-7.5" y1="44" x2="7.5" y2="44" stroke="#B45309" stroke-width="1.4"/>
      <circle cx="0" cy="48.5" r="2" fill="#78350F"/>
    </g>

    <!-- Right: Minimalist Anywhere Door -->
    <g class="float-fast" transform="translate(815, 62)">
      <rect x="0" y="0" width="58" height="94" rx="6" fill="url(#doorPink)" stroke="#FFFFFF" stroke-width="2.5"/>
      <rect x="8" y="9" width="42" height="32" rx="3" fill="#F9A8D4" opacity="0.45"/>
      <rect x="8" y="49" width="42" height="35" rx="3" fill="#F9A8D4" opacity="0.45"/>
      <circle cx="46" cy="48" r="3.8" fill="#FDE047"/>
    </g>

    <!-- Center Typography -->
    <text x="480" y="102" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="1.5">
      doraBighead
    </text>

    <!-- Subtitle Pill -->
    <rect x="268" y="122" width="424" height="34" rx="17" fill="#FFFFFF" opacity="0.18"/>
    <text x="480" y="144" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" letter-spacing="0.6">
      CS Learner  •  Frontend Engineer  •  AI Agent Builder
    </text>

    <!-- Bottom Red Collar Ribbon Accent -->
    <rect x="0" y="211" width="960" height="9" fill="#E60012"/>
    <circle cx="480" cy="211" r="10" fill="url(#bellGold)" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
